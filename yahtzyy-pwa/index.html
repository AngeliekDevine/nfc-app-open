<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="A simple offline Yahtzyy scorecard and dice roller.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Yahtzyy Scorecard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="appbar">
  <div><h1>Yahtzyy</h1><span id="roundLabel">Round 1 of 13</span></div>
  <button id="newGameBtn" class="secondary">New Game</button>
</header>

<main>
  <section class="card dice-card">
    <div class="section-head"><h2>Dice</h2><span id="rollLabel">Roll 0 / 3</span></div>
    <div id="dice" class="dice-row" aria-label="Dice"></div>
    <div class="dice-actions">
      <button id="rollBtn" class="primary">Roll Dice</button>
      <button id="clearHoldsBtn" class="secondary">Unhold All</button>
    </div>
    <p class="hint">Tap a die to hold it between rolls.</p>
  </section>

  <section class="card">
    <div class="section-head"><h2>Players</h2><button id="addPlayerBtn" class="secondary">Add Player</button></div>
    <div id="players" class="players"></div>
  </section>

  <section class="card scorecard">
    <div class="section-head"><h2>Scorecard</h2><span class="hint">Tap a blank cell to score</span></div>
    <div id="scoreTableWrap"></div>
  </section>
</main>

<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
